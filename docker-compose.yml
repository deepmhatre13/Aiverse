version: '3.8'

services:
  # Qdrant Vector Database
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Redis for caching and Celery broker
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # PostgreSQL (shared with Django)
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=aiverse_mentor
      - POSTGRES_USER=aiverse
      - POSTGRES_PASSWORD=aiverse_secret
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiverse"]
      interval: 30s
      timeout: 10s
      retries: 3

  # MLflow for experiment tracking
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.15.0
    ports:
      - "5000:5000"
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri postgresql://aiverse:aiverse_secret@postgres:5432/aiverse_mentor
      --default-artifact-root s3://mlflow-artifacts/
      --artifacts-destination ./mlflow_artifacts
    volumes:
      - mlflow_data:/mlflow
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Agentic Mentor API Service (FastAPI)
  mentor-api:
    build:
      context: .
      dockerfile: Dockerfile.mentor
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=gemini-2.5-pro-exp-03-25
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - DATABASE_URL=postgresql://aiverse:aiverse_secret@postgres:5432/aiverse_mentor
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - LANGSMITH_TRACING=true
      - LANGSMITH_API_KEY=${LANGSMITH_API_KEY}
      - LOG_LEVEL=INFO
      - ENVIRONMENT=production
    volumes:
      - ./knowledge_base:/app/knowledge_base
      - ./uploads:/app/uploads
    depends_on:
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Celery Worker for async tasks
  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile.mentor
    command: celery -A aiverse_agentic_mentor.services.celery_app worker --loglevel=info --concurrency=4
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - DATABASE_URL=postgresql://aiverse:aiverse_secret@postgres:5432/aiverse_mentor
      - LOG_LEVEL=INFO
    volumes:
      - ./knowledge_base:/app/knowledge_base
      - ./uploads:/app/uploads
    depends_on:
      - redis
      - qdrant
    restart: unless-stopped

  # Celery Beat for scheduled tasks (reindexing, etc.)
  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile.mentor
    command: celery -A aiverse_agentic_mentor.services.celery_app beat --loglevel=info
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - QDRANT_HOST=qdrant
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - DATABASE_URL=postgresql://aiverse:aiverse_secret@postgres:5432/aiverse_mentor
    depends_on:
      - redis
    restart: unless-stopped

  # LangSmith proxy (optional - for tracing)
  langsmith-proxy:
    image: langchain/langsmith-sdk:latest
    ports:
      - "1984:1984"
    environment:
      - LANGSMITH_API_KEY=${LANGSMITH_API_KEY}
    profiles:
      - monitoring
    restart: unless-stopped

  # Prometheus for metrics
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    profiles:
      - monitoring
    restart: unless-stopped

  # Grafana for dashboards
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    profiles:
      - monitoring
    restart: unless-stopped

volumes:
  qdrant_data:
  redis_data:
  postgres_data:
  mlflow_data:
  grafana_data: